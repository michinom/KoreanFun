<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>한국어 연습</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #0f766e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, sans-serif;
      background: radial-gradient(circle at top, #fffdf8 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(560px, 100%);
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.25rem;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    .center {
      display: grid;
      place-items: center;
      min-height: 220px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 24px;
      font-size: 1.05rem;
      font-weight: 700;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }

    .list {
      display: grid;
      gap: 14px;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 14px 16px;
    }

    .label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .items {
      font-size: 1.1rem;
      line-height: 1.8;
      letter-spacing: 0.2px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="app">
    <section id="startPage" class="center">

    </section>

    <section id="practicePage" class="hidden">

      <div style="display:grid;place-items:center;margin-top:20px;">

    </section>
  </main>

    function pickRandom(list, count) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, count);
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      const grammar = pickRandom(grammarList, 2);
      const vocab = pickRandom(vocabList, 2);

      document.getElementById("grammarItems").innerHTML = grammar.map(x => `• ${x}`).join("<br>");
      document.getElementById("vocabItems").innerHTML = vocab.map(x => `• ${x}`).join("<br>");

      document.getElementById("startPage").classList.add("hidden");
      document.getElementById("practicePage").classList.remove("hidden");
    });

    function reshuffle() {
      const grammar = pickRandom(grammarList, 2);
      const vocab = pickRandom(vocabList, 2);
      document.getElementById("grammarItems").innerHTML = grammar.map(x => `• ${x}`).join("<br>");
      document.getElementById("vocabItems").innerHTML = vocab.map(x => `• ${x}`).join("<br>");
    }

    document.getElementById("reshuffleBtn").addEventListener("click", reshuffle);
  </script>
</body>
</html>
